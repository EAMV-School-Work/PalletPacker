
services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: palletpacker-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set password in .env}
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/PalletPacker.Web/Dockerfile
    container_name: palletpacker-web
    profiles:
      - full
    depends_on:
      - database
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=PalletPacker;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  sqlserver-data:
